const DB_NAME='ceriabet_assets_v3';

/* Login harus selalu dimulai dari halaman yang bersih.
  - Hapus parameter identitas dari URL login.
  - Hapus hash dashboard/game agar link tidak melewati halaman login.
  - Hapus sesi lama saat halaman dibuka atau dimuat ulang. */
function prepareSecureLoginEntry(){
 const url=new URL(location.href);
 let changed=false;
 if(url.searchParams.has('portal')){url.searchParams.delete('portal');changed=true;}
 const identityParams=new Set([
  'id','uid','userid','memberid','accountid','email','username',
  'token','logintoken','session','sessionid','auth','autologin',
  'password','pass','credential','credentials'
 ]);
 [...url.searchParams.keys()].forEach(key=>{
  const normalized=key.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(identityParams.has(normalized)){
   url.searchParams.delete(key);
   changed=true;
  }
 });
 if(url.hash){
  url.hash='';
  changed=true;
 }
 sessionStorage.removeItem(SESSION_KEY);
 if(changed){
  history.replaceState(null,'',url.pathname+url.search);
 }
}
prepareSecureLoginEntry();
const DB_STORE='assets';
const qs=(s,r=document)=>r.querySelector(s),qsa=(s,r=document)=>[...r.querySelectorAll(s)];

function showPage(page){const key=navItems.find(x=>x[0]===page)?.[3]||page;if(!permitted(key)){toast('Akses ditolak untuk role ini.','error');page='overview';currentPage='overview'}const fn=pages[page]||pages.overview;qs('#pageHost').innerHTML=fn();bindPage(page);hydrateAssets(qs('#pageHost'))}
function linkCard(icon,title,url){return `<div class="link-card"><div class="link-icon">${icon}</div><div class="link-main"><b>${title}</b><span>${esc(url)}</span></div><button class="chip" data-copy="${esc(url)}">Salin</button></div>`}
function activityList(arr){return arr.length?arr.map(a=>`<div class="link-card"><div class="link-icon">${a.type==='game'?'🎮':a.type==='login'?'🔑':a.type==='upload'?'☁':'◴'}</div><div class="link-main"><b>${esc(a.text)}</b><span>${esc(a.actor)} · ${fmtDate(a.createdAt)}</span></div></div>`).join(''):'<div class="muted">Belum ada aktivitas.</div>'}
function membersTable(){const rows=state.members.map(m=>`<tr><td><b>${esc(m.userId)}</b><div class="muted small">${esc(m.name||'-')}</div></td><td>${Number(m.tickets)||0}</td><td>${esc(state.games.find(g=>g.id===m.gameId)?.name||'-')}</td><td><span class="badge ${m.status==='active'?'active':'danger'}">${esc(m.status)}</span></td><td>${m.expiresAt?fmtDate(m.expiresAt):'Tanpa batas'}</td><td><div class="table-actions"><button class="chip" data-edit-member="${m.id}">Edit</button><button class="chip" data-ticket-member="${m.id}" data-delta="1">+1</button><button class="chip" data-ticket-member="${m.id}" data-delta="-1">-1</button><button class="chip danger" data-delete-member="${m.id}">Hapus</button></div></td></tr>`).join('');return table(['Member','Tiket','Game','Status','Expired','Aksi'],rows)}
function ticketsTable(){const rows=state.members.map(m=>`<tr><td><b>${esc(m.userId)}</b></td><td>${Number(m.tickets)||0}</td><td>${esc(state.games.find(g=>g.id===m.gameId)?.name||'-')}</td><td><div class="table-actions"><button class="chip" data-ticket-member="${m.id}" data-delta="1">+1</button><button class="chip" data-ticket-member="${m.id}" data-delta="5">+5</button><button class="chip" data-ticket-member="${m.id}" data-delta="-1">-1</button><button class="chip" data-set-ticket="${m.id}">Set</button></div></td></tr>`).join('');return table(['User ID','Tiket','Game','Ubah Tiket'],rows)}
function prizesTable(){const rows=state.prizes.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted small">${esc(p.type)}</div></td><td>${rupiah(p.value)}</td><td>${Number(p.quota)}</td><td>${Number(p.weight)}</td><td>${esc(state.games.find(g=>g.id===p.gameId)?.name||'-')}</td><td>${hasFeature('managePrizes')?`<div class="table-actions"><button class="chip" data-edit-prize="${p.id}">Edit</button><button class="chip danger" data-delete-prize="${p.id}">Hapus</button></div>`:'Read only'}</td></tr>`).join('');return table(['Hadiah','Nilai','Kuota','Bobot','Game','Aksi'],rows)}
function activityTable(){return table(['Waktu','Jenis','Aktivitas','Pelaku'],state.activities.map(a=>`<tr><td>${fmtDate(a.createdAt)}</td><td><span class="badge">${esc(a.type)}</span></td><td>${esc(a.text)}</td><td>${esc(a.actor)}</td></tr>`).join(''))}
function winnersTable(){return table(['Waktu','Member','Game','Hadiah','Nilai'],state.winners.map(w=>`<tr><td>${fmtDate(w.createdAt)}</td><td><b>${esc(w.userId)}</b></td><td>${esc(w.gameName)}</td><td>${esc(w.prizeName)}</td><td>${rupiah(w.value)}</td></tr>`).join(''))}
function themeManagerPage(){themeDraft=deepClone(state.theme);const locked=false;return pageHead('Theme Manager','Kelola logo, warna, font, animasi, login background, dan preset theme.','<button class="btn" id="publishTheme">Publish Theme</button>')+`<div class="theme-layout"><div><div class="section-tabs"><button class="tab-btn active" data-tab="brand">Brand</button><button class="tab-btn" data-tab="visual">Visual System</button><button class="tab-btn" data-tab="logins">Login Backgrounds</button><button class="tab-btn" data-tab="presets">Theme Presets</button><button class="tab-btn" data-tab="history">History</button></div><div class="tab-panel active" data-panel="brand"><div class="card"><h3>Brand Identity</h3><div class="form-grid"><div class="field"><label>Nama Brand</label><input class="input theme-input" id="brandName" value="${esc(themeDraft.brandName)}"></div><div class="field"><label>Tagline</label><input class="input theme-input" id="brandTagline" value="${esc(themeDraft.brandTagline)}"></div><div class="field wide upload-zone"><label>Logo Utama</label><div class="field-help">PNG, JPG, SVG, atau WebP. Maksimal ${state.settings.maxImageMB} MB.</div><div class="asset-preview contain" id="logoPreview">${themeDraft.logoRef?assetTag(themeDraft.logoRef):'<span class="muted">Belum ada logo</span>'}</div><input type="hidden" id="logoRef" value="${esc(themeDraft.logoRef)}"><input type="file" id="logoUpload" accept=".png,.jpg,.jpeg,.svg,.webp,image/png,image/jpeg,image/svg+xml,image/webp" ${locked?'disabled':''}><div class="row wrap" style="margin-top:10px"><button class="btn secondary" type="button" id="removeLogo" ${locked?'disabled':''}>Hapus Logo</button><span class="badge ${locked?'warn':'active'}">${locked?'Dikunci Super Admin':'Dapat Diubah'}</span></div></div><div class="field wide upload-zone"><label>Favicon / Icon Brand</label><div class="asset-preview contain" id="faviconPreview">${themeDraft.faviconRef?assetTag(themeDraft.faviconRef):'<span class="muted">Belum ada favicon</span>'}</div><input type="hidden" id="faviconRef" value="${esc(themeDraft.faviconRef)}"><input type="file" id="faviconUpload" accept=".png,.jpg,.jpeg,.svg,.webp,image/*"></div></div></div></div><div class="tab-panel" data-panel="visual"><div class="card"><h3>Global Visual System</h3><div class="form-grid">${colorField('Primary','primary',themeDraft.primary)}${colorField('Secondary','secondary',themeDraft.secondary)}${colorField('Accent','accent',themeDraft.accent)}${colorField('Background','background',themeDraft.background)}${colorField('Panel','panel',themeDraft.panel)}${colorField('Text','text',themeDraft.text)}<div class="field"><label>Font</label><select class="select theme-input" id="font"><option ${themeDraft.font==='Inter'?'selected':''}>Inter</option><option ${themeDraft.font==='Poppins'?'selected':''}>Poppins</option><option ${themeDraft.font==='Montserrat'?'selected':''}>Montserrat</option><option ${themeDraft.font==='Orbitron'?'selected':''}>Orbitron</option></select></div><div class="field"><label>Efek Animasi</label><select class="select theme-input" id="animation"><option value="pulse" ${themeDraft.animation==='pulse'?'selected':''}>Pulse</option><option value="float" ${themeDraft.animation==='float'?'selected':''}>Floating</option><option value="none" ${themeDraft.animation==='none'?'selected':''}>Tanpa Animasi</option></select></div><label class="checkbox field wide"><input type="checkbox" id="loadingScreen" ${themeDraft.loadingScreen?'checked':''}> Aktifkan loading screen</label><div class="field wide"><label>Teks Loading</label><input class="input theme-input" id="loadingText" value="${esc(themeDraft.loadingText)}"></div><div class="field wide upload-zone"><label>Background Dashboard</label><div class="asset-preview" id="dashboardPreview">${themeDraft.dashboard.backgroundRef?assetTag(themeDraft.dashboard.backgroundRef,themeDraft.dashboard.backgroundType==='video'?'video':'image'):'<span class="muted">Belum ada background dashboard</span>'}</div><input type="hidden" id="dashboardRef" value="${esc(themeDraft.dashboard.backgroundRef)}"><select class="select" id="dashboardType"><option value="image" ${themeDraft.dashboard.backgroundType==='image'?'selected':''}>Gambar</option><option value="video" ${themeDraft.dashboard.backgroundType==='video'?'selected':''}>Video</option></select><input type="file" id="dashboardUpload" accept="image/*,video/mp4,video/webm"></div></div></div></div><div class="tab-panel" data-panel="logins">${portalEditor()}</div><div class="tab-panel" data-panel="presets"><div class="card"><div class="card-head"><div><h3>Theme Presets</h3><div class="muted small">Simpan snapshot, terapkan kembali, atau hapus tema lama.</div></div><button class="btn secondary" id="savePreset">Simpan Snapshot</button></div><div class="grid two" style="margin-top:15px">${state.themes.map(themePresetCard).join('')}</div></div></div><div class="tab-panel" data-panel="history"><div class="card">${table(['Waktu','Action','Detail','Pelaku'],state.themeHistory.map(h=>`<tr><td>${fmtDate(h.createdAt)}</td><td><span class="badge">${esc(h.action)}</span></td><td>${esc(h.detail)}</td><td>${esc(h.actor)}</td></tr>`).join(''))}</div></div></div><div class="theme-preview"><div class="card"><div class="card-head"><div><h3>Live Preview</h3><div class="muted small">Preview sebelum dipublish.</div></div><span class="badge active">Realtime</span></div><div class="preview-frame" id="themePreview"></div></div></div></div></section>`}
function colorField(label,id,value){return `<div class="field"><label>${label}</label><div class="color-row"><input class="input theme-input" id="${id}" value="${esc(value)}"><input type="color" data-color="${id}" value="${esc(value)}"></div></div>`}
function portalEditor(){const key='super_admin',p=themeDraft.portal.super_admin||defaultPortal();return `<div class="card" style="margin-bottom:14px"><div class="card-head"><div><h3>Login Super Admin</h3><div class="muted small">Background khusus halaman login Super Admin.</div></div><span class="badge active">SUPER ADMIN ONLY</span></div><div class="form-grid"><div class="field"><label>Tipe Background</label><select class="select portal-field" data-portal="${key}" data-key="backgroundType"><option value="gradient" ${p.backgroundType==='gradient'?'selected':''}>Gradient</option><option value="image" ${p.backgroundType==='image'?'selected':''}>Gambar</option><option value="video" ${p.backgroundType==='video'?'selected':''}>Video</option></select></div><div class="field"><label>Posisi</label><select class="select portal-field" data-portal="${key}" data-key="position"><option value="center" ${p.position==='center'?'selected':''}>Center</option><option value="top" ${p.position==='top'?'selected':''}>Top</option><option value="bottom" ${p.position==='bottom'?'selected':''}>Bottom</option><option value="left" ${p.position==='left'?'selected':''}>Left</option><option value="right" ${p.position==='right'?'selected':''}>Right</option></select></div><div class="field"><label>Blur <span id="blurVal-${key}">${p.blur}</span>px</label><input class="portal-field" data-portal="${key}" data-key="blur" type="range" min="0" max="24" value="${p.blur}"></div><div class="field"><label>Overlay <span id="overlayVal-${key}">${p.overlayOpacity}</span></label><input class="portal-field" data-portal="${key}" data-key="overlayOpacity" type="range" min="0" max="0.95" step="0.05" value="${p.overlayOpacity}"></div><div class="field"><label>Warna Overlay</label><input class="input portal-field" data-portal="${key}" data-key="overlayColor" type="color" value="${p.overlayColor}"></div><label class="checkbox"><input class="portal-check" data-portal="${key}" data-key="darkMode" type="checkbox" ${p.darkMode?'checked':''}> Dark Mode</label><div class="field wide upload-zone"><label>Upload Gambar Login</label><div class="asset-preview" id="portalImagePreview-${key}">${p.imageRef?assetTag(p.imageRef):'<span class="muted">Belum ada gambar</span>'}</div><input class="portal-upload" data-portal="${key}" data-kind="image" type="file" accept="image/*"></div><div class="field wide upload-zone"><label>Upload Video Login</label><div class="asset-preview" id="portalVideoPreview-${key}">${p.videoRef?assetTag(p.videoRef,'video'):'<span class="muted">Belum ada video</span>'}</div><input class="portal-upload" data-portal="${key}" data-kind="video" type="file" accept="video/mp4,video/webm"></div></div></div>`}
function themePresetCard(x){return `<div class="asset-card"><div class="asset-meta"><div class="card-head"><div><b>${esc(x.name)}</b><div class="muted tiny">${fmtDate(x.createdAt)} · ${esc(x.createdBy||'System')}</div></div><span class="badge ${state.theme.id===x.id?'active':''}">${state.theme.id===x.id?'Aktif':'Preset'}</span></div><div class="table-actions" style="margin-top:12px"><button class="chip" data-apply-theme="${x.id}">Terapkan</button>${x.id!=='theme-default'?`<button class="chip danger" data-delete-theme="${x.id}">Hapus</button>`:''}</div></div></div>`}
function settingsPage(){return pageHead('System Settings','Atur timezone, maintenance, keamanan upload, backup, dan reset.')+`<div class="grid two"><div class="card"><form id="settingsForm" class="form-grid"><div class="field"><label>Timezone</label><select class="select" id="settingTimezone"><option ${state.settings.timezone==='Asia/Jakarta'?'selected':''}>Asia/Jakarta</option><option ${state.settings.timezone==='Asia/Phnom_Penh'?'selected':''}>Asia/Phnom_Penh</option><option ${state.settings.timezone==='UTC'?'selected':''}>UTC</option></select></div><div class="field"><label>Maintenance</label><select class="select" id="settingMaintenance"><option value="false" ${!state.settings.maintenance?'selected':''}>Off</option><option value="true" ${state.settings.maintenance?'selected':''}>On</option></select></div><div class="field wide"><label>Pesan Maintenance</label><input class="input" id="settingMessage" value="${esc(state.settings.maintenanceMessage)}"></div><div class="field"><label>Limit Gambar (MB)</label><input class="input" id="maxImageMB" type="number" min="1" max="10" value="${state.settings.maxImageMB}"></div><div class="field"><label>Limit Video (MB)</label><input class="input" id="maxVideoMB" type="number" min="2" max="50" value="${state.settings.maxVideoMB}"></div><div class="field"><label>Session Login (menit)</label><input class="input" id="sessionMinutes" type="number" min="15" max="1440" value="${state.settings.sessionMinutes}"></div><label class="checkbox"><input type="checkbox" id="brandLocked" ${state.settings.brandLocked?'checked':''}> Kunci perubahan logo utama</label><div class="form-actions"><button class="btn">SIMPAN SETTINGS</button></div></form></div><div class="card"><h3>Backup & Recovery</h3><div class="stack"><button class="btn secondary" id="exportData">Export Konfigurasi JSON</button><label class="btn secondary" style="text-align:center">Import Konfigurasi JSON<input type="file" id="importData" accept="application/json" hidden></label><button class="btn secondary" id="backupTheme">Backup Theme Aktif</button><button class="btn danger" id="resetAll">RESET SELURUH DATA DEMO</button></div><div class="notice warning" style="margin-top:14px">Static GitHub Pages menyimpan data per browser. Untuk multi-device dan keamanan produksi, gunakan backend + database + object storage.</div></div></div></section>`}
function bindPage(page){qsa('[data-go]').forEach(b=>b.onclick=()=>{currentPage=b.dataset.go;qsa('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===currentPage));showPage(currentPage)});qsa('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast('Link berhasil disalin.','success')}catch{toast('Salin manual dari kolom link.','error')}});bindCommonActions();if(page==='members')bindMembers();if(page==='prizes'&&hasFeature('managePrizes'))bindPrizes();if(page==='theme')bindThemeManager();if(page==='settings')bindSettings();if(page==='account')bindAccount()}
function bindCommonActions(){qsa('[data-ticket-member]').forEach(b=>b.onclick=()=>changeTicket(b.dataset.ticketMember,Number(b.dataset.delta)));qsa('[data-set-ticket]').forEach(b=>b.onclick=()=>{const m=state.members.find(x=>x.id===b.dataset.setTicket),n=prompt('Masukkan jumlah tiket baru:',m.tickets);if(n!==null&&!Number.isNaN(Number(n))){const old=m.tickets;m.tickets=Math.max(0,Number(n));logActivity(`Tiket ${m.userId} diubah dari ${old} menjadi ${m.tickets}.`,'ticket');logAudit('SET_TICKET',`${m.userId}: ${old} -> ${m.tickets}`);saveState();showPage(currentPage)}})}
function changeTicket(id,delta){const m=state.members.find(x=>x.id===id);if(!m)return;const old=Number(m.tickets)||0;m.tickets=Math.max(0,old+delta);logActivity(`Tiket ${m.userId} ${delta>=0?'ditambah':'dikurangi'} ${Math.abs(delta)}.`,'ticket');logAudit('UPDATE_TICKET',`${m.userId}: ${old} -> ${m.tickets}`);saveState();showPage(currentPage)}
function bindMembers(){qs('#memberForm').onsubmit=e=>{e.preventDefault();const id=qs('#memberId').value,userId=qs('#memberUserId').value.trim().toUpperCase();if(state.members.some(m=>m.userId===userId&&m.id!==id)){toast('User ID sudah digunakan.','error');return}const data={userId,name:qs('#memberName').value.trim(),gameId:qs('#memberGame').value,tickets:Math.max(0,Number(qs('#memberTickets').value)),status:qs('#memberStatus').value,expiresAt:qs('#memberExpires').value?new Date(qs('#memberExpires').value).toISOString():'',notes:qs('#memberNotes').value.trim()};if(id)Object.assign(state.members.find(m=>m.id===id),data);else state.members.push({id:uid(),createdAt:now(),...data});logActivity(`${id?'Member diperbarui':'Member dibuat'}: ${userId}.`,'member');logAudit(id?'UPDATE_MEMBER':'CREATE_MEMBER',userId);saveState();showPage('members');toast('Data member berhasil disimpan.','success')};qsa('[data-edit-member]').forEach(b=>b.onclick=()=>{const m=state.members.find(x=>x.id===b.dataset.editMember);qs('#memberId').value=m.id;qs('#memberUserId').value=m.userId;qs('#memberName').value=m.name;qs('#memberGame').value=m.gameId;qs('#memberTickets').value=m.tickets;qs('#memberStatus').value=m.status;qs('#memberExpires').value=m.expiresAt?new Date(m.expiresAt).toISOString().slice(0,16):'';qs('#memberNotes').value=m.notes||'';scrollTo({top:0,behavior:'smooth'})});qsa('[data-delete-member]').forEach(b=>b.onclick=()=>{const m=state.members.find(x=>x.id===b.dataset.deleteMember);if(confirm(`Hapus member ${m.userId}?`)){state.members=state.members.filter(x=>x.id!==m.id);logAudit('DELETE_MEMBER',m.userId);saveState();showPage('members')}})}

function categoryMeta(key){return BONUS_CATEGORIES[key]||BONUS_CATEGORIES.ticket_balance}

function bonusItemsFor(memberId,category,status){
 return (state.bonusItems||[]).filter(x=>x.memberId===memberId&&(!category||x.category===category)&&(!status||x.status===status));
}
function availableBonusCount(member){
 if(!member)return 0;
 return bonusItemsFor(member.id,member.bonusCategory,'available').length;
}
function syncLegacyTicketCounter(member){
 if(member)member.tickets=availableBonusCount(member);
}
function ensureBonusSystem(){
 state.bonusItems=Array.isArray(state.bonusItems)?state.bonusItems:[];
 state.bonusHistory=Array.isArray(state.bonusHistory)?state.bonusHistory:[];
 state.members=Array.isArray(state.members)?state.members:[];
 state.members.forEach(member=>{
  member.bonusCategory=BONUS_CATEGORIES[member.bonusCategory]?member.bonusCategory:'ticket_balance';
  member.status=member.status||'active';
  if(!member.bonusInventoryMigrated){
   const legacy=Math.max(0,Math.floor(Number(member.tickets)||0));
   if(!state.bonusItems.some(x=>x.memberId===member.id)&&legacy>0){
    const batchId=uid();
    for(let i=0;i<legacy;i++){
     state.bonusItems.push({
      id:uid(),code:`LEG-${String(i+1).padStart(4,'0')}-${member.id}`,
      batchId,memberId:member.id,userId:member.userId,
      category:member.bonusCategory,status:'available',
      createdAt:member.createdAt||now(),createdBy:'System Migration',
      usedAt:'',usedBy:'',rewardText:''
     });
    }
   }
   member.bonusInventoryMigrated=true;
  }
  syncLegacyTicketCounter(member);
 });
 state.schemaVersion=4;
}

function issueBonusItems(member,category,quantity){
 if(!member)throw new Error('Data member tidak ditemukan.');
 if(!BONUS_CATEGORIES[category])throw new Error('Kategori Bonus tidak valid.');
 const qty=Number(quantity);
 if(!Number.isInteger(qty)||qty<1)throw new Error('Jumlah tiket/voucher minimal 1.');
 if(qty>10000)throw new Error('Maksimal 10.000 item dalam satu proses.');
 const before=(state.bonusItems||[]).length;
 const batchId=uid(),actor=session?.name||'System',meta=categoryMeta(category);
 for(let i=0;i<qty;i++){
  state.bonusItems.push({
   id:uid(),
   code:`${category.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)}-${Date.now().toString(36).toUpperCase()}-${String(i+1).padStart(4,'0')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`,
   batchId,memberId:member.id,userId:member.userId,category,status:'available',
   createdAt:now(),createdBy:actor,usedAt:'',usedBy:'',rewardText:''
  });
 }
 const created=state.bonusItems.length-before;
 if(created!==qty){
  state.bonusItems=state.bonusItems.filter(x=>x.batchId!==batchId);
  throw new Error(`Pembuatan gagal: diminta ${qty}, tercipta ${created}.`);
 }
 member.bonusCategory=category;
 syncLegacyTicketCounter(member);
 state.bonusHistory.unshift({
  id:uid(),action:'ISSUE',batchId,memberId:member.id,userId:member.userId,
  category,quantity:qty,itemCode:'',rewardText:`${qty} ${meta.unit}`,
  remaining:availableBonusCount(member),actor,createdAt:now()
 });
 logActivity(`${qty} ${meta.unit} ${meta.label} dibuat untuk ${member.userId}.`,'ticket',actor);
 logAudit('ISSUE_BONUS_ITEMS',`${member.userId} · ${meta.label} · ${qty} item`);
 return created;
}
function rewardForCategory(member,category){
 const usedBefore=bonusItemsFor(member.id,category,'used').length;
 if(category==='ticket_balance'){
  const amount=usedBefore%2===0?10000:5000;
  return {text:`Saldo ${rupiah(amount)}`,value:amount,type:'Saldo'};
 }
 if(category==='coupon_food')return{text:'Voucher Makanan',value:0,type:'Voucher'};
 if(category==='coupon_coffee')return{text:'Voucher Kopi',value:0,type:'Voucher'};
 if(category==='coupon_jersey')return{text:'Jersey Bola Sesuai Request',value:0,type:'Voucher'};
 return{text:'Saldo\nFreechip Sportbook',value:0,type:'Saldo + Freechip Sportbook'};
}
function consumeBonusItem(member){
 const item=bonusItemsFor(member.id,member.bonusCategory,'available')
  .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt))[0];
 if(!item)return null;
 const reward=rewardForCategory(member,member.bonusCategory);
 item.status='used';item.usedAt=now();item.usedBy=member.userId;item.rewardText=reward.text;
 syncLegacyTicketCounter(member);
 state.bonusHistory.unshift({
  id:uid(),action:'USE',batchId:item.batchId,memberId:member.id,userId:member.userId,
  category:item.category,quantity:1,itemCode:item.code,rewardText:reward.text,
  remaining:availableBonusCount(member),actor:member.userId,createdAt:now()
 });
 return{item,reward,remaining:availableBonusCount(member)};
}
function revokeMemberInventory(member){
 const actor=session?.name||'System';
 bonusItemsFor(member.id,'','available').forEach(x=>{x.status='revoked';x.usedAt=now();x.usedBy=actor});
 state.bonusHistory.unshift({
  id:uid(),action:'REVOKE_MEMBER',batchId:'',memberId:member.id,userId:member.userId,
  category:member.bonusCategory,quantity:0,itemCode:'',rewardText:'Member dihapus; item aktif dibatalkan.',
  remaining:0,actor,createdAt:now()
 });
}
function membersTable(){
 const rows=state.members.map(m=>{
  const meta=categoryMeta(m.bonusCategory),available=availableBonusCount(m);
  const issued=bonusItemsFor(m.id,m.bonusCategory).filter(x=>x.status!=='revoked').length;
  const used=bonusItemsFor(m.id,m.bonusCategory,'used').length;
  return `<tr><td><b>${esc(m.userId)}</b></td><td><span class="category-label">${meta.icon} ${esc(meta.label)}</span></td><td><b>${available}</b> ${meta.unit}</td><td>${issued}</td><td>${used}</td><td><span class="badge ${m.status==='active'?'active':'danger'}">${esc(m.status)}</span></td><td><div class="table-actions"><button class="chip" data-edit-member="${m.id}">Edit / Tambah</button><button class="chip danger" data-delete-member="${m.id}">Hapus</button></div></td></tr>`;
 }).join('');
 return table(['User ID','Kategori Bonus','Tersedia','Dibuat','Terpakai','Status','Aksi'],rows);
}
function ticketsTable(){
 const rows=[...(state.bonusItems||[])].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,2000).map(x=>{
  const meta=categoryMeta(x.category);
  const badge=x.status==='available'?'active':x.status==='used'?'warn':'danger';
  return `<tr><td><span class="item-code">${esc(x.code)}</span></td><td><b>${esc(x.userId||'-')}</b></td><td>${esc(meta.label)}</td><td><span class="badge ${badge}">${esc(x.status)}</span></td><td>${fmtDate(x.createdAt)}</td><td>${x.usedAt?fmtDate(x.usedAt):'-'}</td><td>${esc(x.rewardText||'-')}</td></tr>`;
 }).join('');
 return table(['Kode Item','User ID','Kategori','Status','Dibuat','Digunakan','Hadiah'],rows);
}
function bonusHistoryTable(){
 const rows=(state.bonusHistory||[]).slice(0,1000).map(x=>`<tr><td>${fmtDate(x.createdAt)}</td><td><span class="badge">${esc(x.action)}</span></td><td><b>${esc(x.userId)}</b></td><td>${esc(categoryMeta(x.category).label)}</td><td>${Number(x.quantity)||0}</td><td>${esc(x.itemCode||'-')}</td><td>${esc(x.rewardText||'-')}</td><td>${Number(x.remaining)||0}</td><td>${esc(x.actor||'-')}</td></tr>`).join('');
 return table(['Waktu','Aksi','User ID','Kategori','Jumlah','Kode Item','Detail/Hadiah','Sisa','Pelaku'],rows);
}
function inventoryStatsHTML(){
 return `<div class="inventory-grid">${Object.entries(BONUS_CATEGORIES).map(([key,x])=>{
  const available=(state.bonusItems||[]).filter(i=>i.category===key&&i.status==='available').length;
  return `<div class="inventory-card"><span>${x.icon} ${esc(x.label)}</span><strong>${available}</strong><div class="muted tiny">${x.unit} tersedia</div></div>`;
 }).join('')}</div>`;
}
pages.members=()=>pageHead('Member Management','Daftarkan User ID dan buat tiket/voucher otomatis sesuai Kategori Bonus.')+
`<div class="grid two"><div class="card"><div class="card-head"><div><h3>Buat / Edit Member</h3><div class="muted small">Jumlah yang dimasukkan akan dibuat sebagai record individual.</div></div><span class="badge active">EXACT QUANTITY</span></div>
<form id="memberForm" class="form-grid"><input type="hidden" id="memberId">
<div class="field"><label>User ID</label><input class="input" id="memberUserId" maxlength="40" placeholder="MEMBER001" required></div>
<div class="field"><label>Kategori Bonus</label><select class="select" id="memberBonusCategory">${bonusCategoryOptions()}</select></div>
<div class="field wide"><label id="memberQuantityLabel">Jumlah Tiket</label><input class="input" id="memberQuantity" type="number" min="1" max="10000" step="1" value="1" required><div class="field-help" id="memberQuantityHelp"></div></div>
<div class="bonus-form-note"><b id="memberCategoryTitle">🎟️ Tiket Saldo</b><span class="muted small" id="memberCategoryDescription">Sistem membuat tiket saldo satu per satu dan menghubungkannya ke User ID.</span></div>
<div class="form-actions"><button class="btn secondary" type="reset" id="memberReset">Reset</button><button class="btn">SIMPAN & BUAT ITEM</button></div>
</form></div>
<div class="card"><h3>Aturan Operasional</h3><div class="notice">Seluruh data user, tiket, voucher, dan riwayat hadiah dikelola langsung dari Super Admin.</div><div style="margin-top:14px">${databaseModeHTML()}</div></div></div>
<div class="card" style="margin-top:16px"><div class="card-head"><h3>Ringkasan Inventory</h3><span class="badge">${(state.bonusItems||[]).filter(x=>x.status==='available').length} tersedia</span></div>${inventoryStatsHTML()}</div>
<div class="card" style="margin-top:16px"><div class="card-head"><h3>Data Member</h3><span class="badge">${state.members.length} member</span></div>${membersTable()}</div></section>`;
pages.tickets=()=>pageHead('Tiket, Voucher & Bonus History','Setiap item memiliki kode unik dan hanya dapat digunakan satu kali.')+
`<div class="card"><div class="card-head"><h3>Seluruh Item</h3><span class="badge">${(state.bonusItems||[]).length} record</span></div>${ticketsTable()}</div>
<div class="card" style="margin-top:16px"><div class="card-head"><h3>Riwayat Pembuatan & Penggunaan</h3><span class="badge">${(state.bonusHistory||[]).length} aktivitas</span></div>${bonusHistoryTable()}</div></section>`;
function updateBonusFormUI(){
 const select=qs('#memberBonusCategory');if(!select)return;
 const meta=categoryMeta(select.value);
 qs('#memberQuantityLabel').textContent=meta.inputLabel;
 qs('#memberQuantityHelp').textContent=`Input 1 membuat tepat 1 ${meta.unit}; input 30 membuat tepat 30 ${meta.unit}.`;
 qs('#memberCategoryTitle').textContent=`${meta.icon} ${meta.label}`;
 const desc={
  ticket_balance:'Hadiah kemenangan mengikuti urutan Saldo Rp10.000, Rp5.000, Rp10.000, lalu berulang.',
  coupon_food:'Setiap kemenangan menggunakan 1 voucher dan menampilkan Voucher Makanan.',
  coupon_coffee:'Setiap kemenangan menggunakan 1 voucher dan menampilkan Voucher Kopi.',
  coupon_jersey:'Setiap kemenangan menggunakan 1 voucher dan menampilkan Jersey Bola Sesuai Request.',
  coupon_combo:'Setiap kemenangan menggunakan 1 tiket dan menampilkan Saldo + Freechip Sportbook.'
 };
 qs('#memberCategoryDescription').textContent=desc[select.value];
}
function bindMembers(){
 if(!assertMemberOperationalAccess())return;
 qs('#memberBonusCategory').onchange=updateBonusFormUI;
 qs('#memberForm').onreset=()=>setTimeout(updateBonusFormUI,0);
 updateBonusFormUI();
 qs('#memberForm').onsubmit=e=>{
  e.preventDefault();
  if(!assertMemberOperationalAccess())return;
  const id=qs('#memberId').value;
  const userId=qs('#memberUserId').value.trim().toUpperCase();
  const category=qs('#memberBonusCategory').value;
  const quantity=Number(qs('#memberQuantity').value);
  if(!/^[A-Z0-9._-]{3,40}$/.test(userId)){toast('User ID minimal 3 karakter dan hanya boleh memakai huruf, angka, titik, garis bawah, atau strip.','error');return}
  if(state.members.some(m=>m.userId===userId&&m.id!==id)){toast('User ID sudah digunakan.','error');return}
  try{
   let member;
   if(id){
    member=state.members.find(m=>m.id===id);
    if(!member)throw new Error('Member tidak ditemukan.');
    member.userId=userId;member.bonusCategory=category;member.status='active';
    state.bonusItems.filter(x=>x.memberId===member.id).forEach(x=>x.userId=userId);
   }else{
    member={id:uid(),userId,bonusCategory:category,tickets:0,status:'active',gameId:state.games[0]?.id||'',createdAt:now(),expiresAt:'',notes:'',bonusInventoryMigrated:true};
    state.members.push(member);
   }
   const created=issueBonusItems(member,category,quantity);
   saveState();
   showPage('members');
   toast(`${created} ${categoryMeta(category).unit} berhasil dibuat untuk ${userId}.`,'success');
  }catch(err){toast(err.message||'Data member gagal disimpan.','error')}
 };
 qsa('[data-edit-member]').forEach(b=>b.onclick=()=>{
  if(!assertMemberOperationalAccess())return;
  const m=state.members.find(x=>x.id===b.dataset.editMember);if(!m)return;
  qs('#memberId').value=m.id;qs('#memberUserId').value=m.userId;
  qs('#memberBonusCategory').value=m.bonusCategory;qs('#memberQuantity').value=1;
  updateBonusFormUI();scrollTo({top:0,behavior:'smooth'});
 });
 qsa('[data-delete-member]').forEach(b=>b.onclick=()=>{
  if(!assertMemberOperationalAccess())return;
  const m=state.members.find(x=>x.id===b.dataset.deleteMember);if(!m)return;
  if(confirm(`Hapus member ${m.userId}? Tiket/voucher aktif akan dibatalkan, tetapi riwayat tetap disimpan.`)){
   revokeMemberInventory(m);
   state.members=state.members.filter(x=>x.id!==m.id);
   logActivity(`Member ${m.userId} dihapus.`,'member',session?.name||'System');
   logAudit('DELETE_MEMBER',m.userId);saveState();showPage('members');
   toast('Member dihapus dan inventory aktif dibatalkan.','success');
  }
 });
}
function remoteOperationalPayload(){return{scope:'full_access',role:'super_admin',state}}
async function pushSharedDatabase(){
 if(!sharedDatabaseReady()||remoteSyncInFlight)return;
 remoteSyncInFlight=true;
 try{
  const res=await fetch(SHARED_DATABASE_API_URL,{
   method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify({action:'savePlatformState',token:SHARED_DATABASE_API_TOKEN,...remoteOperationalPayload()})
  });
  if(!res.ok)throw new Error('Server database menolak penyimpanan.');
  const json=await res.json();if(json.success===false)throw new Error(json.message||'Penyimpanan server gagal.');
  if(json.state){
   state=migrateState(json.state);ensureRaceUpgrade();ensureBonusSystem();
   localStorage.setItem(APP_KEY,JSON.stringify(state));
   applyThemeVars();syncChannel?.postMessage({type:'STATE_UPDATED',state});
  }
 }catch(err){console.error('Shared database save:',err)}
 finally{remoteSyncInFlight=false}
}
function queueRemoteSync(){
 if(!sharedDatabaseReady())return;
 clearTimeout(remoteSyncTimer);remoteSyncTimer=setTimeout(pushSharedDatabase,450);
}
async function pullSharedDatabase(){
 if(!sharedDatabaseReady())return;
 try{
  const url=new URL(SHARED_DATABASE_API_URL);
  url.searchParams.set('action','loadPlatformState');url.searchParams.set('token',SHARED_DATABASE_API_TOKEN);url.searchParams.set('role','super_admin');url.searchParams.set('_',Date.now());
  const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('Database bersama tidak dapat dibaca.');
  const json=await res.json();if(json.success===false)throw new Error(json.message||'Load database gagal.');
  if(json.state)state=migrateState(json.state);
  else if(json.data){
   Object.assign(state,json.data);
  }
  ensureRaceUpgrade();ensureBonusSystem();
 }catch(err){console.error('Shared database load:',err)}
}
function writeMemberRegistry(){
 try{
  const registry={version:2,updatedAt:now(),members:Array.isArray(state.members)?state.members:[],bonusItems:Array.isArray(state.bonusItems)?state.bonusItems:[],bonusHistory:Array.isArray(state.bonusHistory)?state.bonusHistory:[],games:Array.isArray(state.games)?state.games:[],settings:state.settings||{},raceConfig:state.raceConfig||{},theme:state.theme||{},winners:Array.isArray(state.winners)?state.winners:[],activities:Array.isArray(state.activities)?state.activities:[],audit:Array.isArray(state.audit)?state.audit:[]};
  localStorage.setItem(MEMBER_REGISTRY_KEY,JSON.stringify(registry));
 }catch(err){console.error('Member registry save:',err)}
}
function saveState(){
 try{
  localStorage.setItem(APP_KEY,JSON.stringify(state));
   writeMemberRegistry();
  applyThemeVars();
  syncChannel?.postMessage({type:'STATE_UPDATED',state});
  queueRemoteSync();
 }catch(e){toast('Penyimpanan browser penuh. Pasang database bersama untuk data produksi.','error')}
}
async function bootstrapApplication(){
 await pullSharedDatabase();
 ensureBonusSystem();
 saveState();
 route();
}
syncChannel?.addEventListener('message',e=>{if(e.data?.type==='STATE_UPDATED'){ensureBonusSystem()}});

bootstrapApplication();
</script>
